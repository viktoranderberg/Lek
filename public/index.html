<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tjänstebil – Bokningssystem</title>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="3" width="15" height="13" rx="2"/>
    <path d="M16 8h4l3 5v3h-7V8z"/>
    <circle cx="5.5" cy="18.5" r="2.5"/>
    <circle cx="18.5" cy="18.5" r="2.5"/>
  </svg>
  <div>
    <h1>Tjänstebil – Bokningssystem</h1>
    <p id="headerSub">Laddar…</p>
  </div>
  <button class="admin-btn" onclick="openAdminPanel()">&#9881; Admin</button>
</header>

<main>
  <!-- Admin panel (visas när inloggad) -->
  <div id="adminPanelContainer" style="display:none"></div>

  <div class="summary" id="summary"></div>

  <div class="controls">
    <div class="field">
      <label>Vy</label>
      <div class="view-toggle">
        <button id="btnCalendar" class="active" onclick="setView('calendar')">Kalender</button>
        <button id="btnList"     onclick="setView('list')">Lista</button>
      </div>
    </div>
    <div id="listOnlyControls" style="display:none;flex:1;gap:1rem;flex-wrap:wrap">
      <div class="field">
        <label>Filtrera användare</label>
        <select id="filterUser" onchange="render()">
          <option value="">Alla användare</option>
        </select>
      </div>
      <div class="field">
        <label>Sök</label>
        <input type="text" id="searchInput" placeholder="Destination, anteckning…" oninput="render()" />
      </div>
    </div>
    <div class="field" style="flex:0 0 auto">
      <label>&nbsp;</label>
      <button class="btn btn-primary" onclick="openNewBooking()">+ Ny bokning</button>
      <button class="btn btn-sm" style="border:1px solid var(--border);margin-top:.35rem" onclick="exportCsv()">Exportera CSV</button>
    </div>
  </div>

  <!-- Calendar -->
  <div id="calView">
    <div class="cal-header">
      <div style="display:flex;align-items:center;gap:.35rem">
        <button class="cal-nav" onclick="changeYear(-1)" title="Föregående år">&#171;</button>
        <button class="cal-nav" onclick="changeMonth(-1)" title="Föregående månad">&#8249;</button>
      </div>
      <div style="display:flex;align-items:center;gap:.75rem">
        <h2 id="calTitle"></h2>
        <button class="cal-nav" style="font-size:.75rem;padding:.25rem .6rem" onclick="goToday()">Idag</button>
        <span id="weatherWidget" style="font-size:.8rem;color:var(--muted);white-space:nowrap"></span>
      </div>
      <div style="display:flex;align-items:center;gap:.35rem">
        <button class="cal-nav" onclick="changeMonth(1)" title="Nästa månad">&#8250;</button>
        <button class="cal-nav" onclick="changeYear(1)" title="Nästa år">&#187;</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- List -->
  <div id="listView" style="display:none">
    <div class="booking-list" id="bookingList"></div>
  </div>
</main>

<!-- ─── Bokningsmodal ────────────────────────────────────────── -->
<div class="overlay hidden" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">Ny bokning</h3>

    <div class="form-group">
      <label>Användare</label>
      <select id="fUser"></select>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Startdatum</label>
        <input type="date" id="fStart" onchange="validateDates()" />
      </div>
      <div class="form-group">
        <label>Slutdatum</label>
        <input type="date" id="fEnd" onchange="validateDates()" />
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Starttid</label>
        <input type="time" id="fStartTime" value="08:00" />
      </div>
      <div class="form-group">
        <label>Sluttid</label>
        <input type="time" id="fEndTime" value="17:00" />
      </div>
    </div>

    <div id="dateError" class="error-msg">Slutdatum måste vara samma eller efter startdatum.</div>

    <hr class="section-divider" />
    <div class="section-title">Rutt &amp; Milantal</div>

    <div class="addr-block">
      <div class="addr-title">Utgångspunkt</div>

      <div class="switch-row">
        <input type="checkbox" id="altOrigin" onchange="toggleAltOrigin()" />
        <label for="altOrigin">Annan utgångspunkt (standard: Stjärntorget 1, Solna)</label>
      </div>

      <div id="originField" style="display:none" class="form-group">
        <input type="text" id="fOrigin" placeholder="t.ex. Drottninggatan 1, Stockholm" />
      </div>

      <div class="form-group" style="margin-bottom:.5rem;margin-top:.5rem">
        <label>Destination</label>
        <input type="text" id="fDest" placeholder="t.ex. Arlanda flygplats" oninput="clearRouteResult()" />
      </div>

      <div class="switch-row">
        <input type="checkbox" id="fRoundTrip" checked />
        <label for="fRoundTrip">Tur och retur (×2)</label>
      </div>

      <button class="btn btn-primary btn-sm" onclick="calcRoute()" id="btnCalcRoute">
        Beräkna avstånd
      </button>

      <div class="addr-status" id="addrStatus"></div>

      <div class="calc-result" id="calcResult">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="calcResultText"></span>
        <button class="btn btn-sm btn-primary" onclick="applyMil()" style="margin-left:auto">Använd</button>
      </div>
    </div>

    <hr class="section-divider" />
    <div class="section-title">Anteckningar</div>
    <div class="form-group">
      <textarea id="fNotes" placeholder="Beskriv ärende, kund, destination m.m."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn" style="border:1px solid var(--border)" onclick="closeModal()">Avbryt</button>
      <button class="btn btn-danger btn-sm" id="btnDelete" style="display:none" onclick="deleteBooking()">Ta bort</button>
      <button class="btn btn-primary" onclick="saveBooking()">Spara</button>
    </div>
  </div>
</div>

<!-- ─── Admin-inloggning ─────────────────────────────────────── -->
<div class="overlay hidden" id="adminOverlay" onclick="this.classList.add('hidden')">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:360px">
    <h3>Admin-inloggning</h3>
    <div class="form-group">
      <label>Lösenord</label>
      <input type="password" id="adminPassword" placeholder="Adminlösenord"
             onkeydown="if(event.key==='Enter')adminLogin()" />
    </div>
    <div id="adminLoginError" class="error-msg" style="display:none">Fel lösenord.</div>
    <div class="modal-actions">
      <button class="btn" style="border:1px solid var(--border)"
              onclick="document.getElementById('adminOverlay').classList.add('hidden')">Avbryt</button>
      <button class="btn btn-primary" onclick="adminLogin()">Logga in</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>
<script src="app.js"></script>
</body>
</html>
